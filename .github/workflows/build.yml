name: Godot iOS Unsigned Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Download Godot Engine
        run: |
          curl -LO https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_macos.universal.zip
          unzip Godot_v4.4-stable_macos.universal.zip
          mv Godot.app /Applications/Godot.app

      - name: Export Godot Project to iOS
        run: |
          mkdir -p ios_export
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" ios_export/car_test.xcodeproj

      - name: Build Unsigned App
        run: |
          cd ios_export
          xcodebuild build -project car_test.xcodeproj -scheme "car_test (4.4)" -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios_export/build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r ios_export/*.app Payload/ 2>/dev/null
          zip -r car_test_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-unsigned-ipa
          path: car_test_unsigned.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "Car Test iOS v1.0.0"
          files: car_test_unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
