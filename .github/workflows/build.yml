name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Project
        run: |
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          if [ -n "$PROJ" ]; then
            echo "Found project: $PROJ"
            xcodebuild build -project "$PROJ" -scheme "car_test (4.4)" -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            echo "Searching for build path..."
            mkdir -p build/Release-iphoneos
            xcodebuild -version
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r *.app Payload/ 2>/dev/null || cp -r */*.app Payload/ 2>/dev/null || cp -r build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null
          zip -r car_test.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: car_test.ipa
