      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project "اختبار السيارة (4.4)/اختبار السيارة (4.4).xcodeproj" \
            -scheme "اختبار السيارة (4.4)" \
            -archivePath build/car_test.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/car_test.xcarchive/Products/Applications/*.app Payload/
          zip -r car_test.ipa Payload
