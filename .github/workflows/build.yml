name: Godot iOS Unsigned Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Find Project and Build Unsigned
        run: |
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "Xcode project not found!"
            exit 1
          fi
          echo "Building project at: $PROJ"
          xcodebuild build \
            -project "$PROJ" \
            -scheme "car_test (4.4)" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          find . -name "*.app" -maxdepth 5 -exec cp -r {} Payload/ \;
          zip -r car_test_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-unsigned-ipa
          path: car_test_unsigned.ipa
